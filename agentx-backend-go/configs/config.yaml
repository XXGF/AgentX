server:
  port: 8088
  context-path: /api

database:
  host: localhost
  port: 5432
  user: postgres
  password: postgres
  name: agentx
  sslmode: disable
  max-idle-conns: 10
  max-open-conns: 100

jwt:
  secret: "5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437"
  expiration: 86400 # 24小时（秒）

logging:
  level: debug

rabbitmq:
  host: localhost
  port: 5672
  username: guest
  password: guest

# ========== 邮件服务配置 ==========
# SMTP 邮件发送配置，用于发送验证码、通知等邮件
# 支持 QQ邮箱、163邮箱、Gmail、SendGrid 等 SMTP 服务
mail:
  smtp:
    host: smtp.qq.com        # SMTP 服务器地址（QQ: smtp.qq.com, 163: smtp.163.com, Gmail: smtp.gmail.com）
    port: 587                # SMTP 端口（587=STARTTLS, 465=SSL, 25=明文）
    username: ""             # 发件人邮箱地址（如: your-email@qq.com）
    password: ""             # SMTP 授权码（非邮箱密码，需在邮箱设置中生成）
  verification:
    template: "您的验证码是:%s，有效期10分钟，请勿泄露给他人。"
    subject: "AgentX - 邮箱验证码"

# ========== GitHub 配置 ==========
# 用于 MCP 工具社区仓库的访问
github:
  target:
    repo-name: agent-mcp-community
    username: lucky-aeon
    token: ""                # GitHub Personal Access Token（Settings -> Developer settings -> Tokens）

# ========== Docker/容器管理配置 ==========
# 用于 MCP 工具容器的创建和管理
docker:
  host: "unix:///var/run/docker.sock"  # Docker daemon 地址（Linux: unix:///var/run/docker.sock, macOS: 同左, Windows: tcp://localhost:2375）
  user-volume-base-path: "/docker/users"
  default-mcp-gateway-image: "ghcr.io/lucky-aeon/mcp-gateway:latest"
  monitor-interval: 300000             # 容器监控间隔（毫秒）
  stats-update-interval: 120000        # 资源统计更新间隔（毫秒）

# ========== 支付配置 ==========
# 支持支付宝和 Stripe 两种支付方式
payment:
  alipay:
    app-id: ""               # 支付宝开放平台 AppID（https://open.alipay.com）
    private-key: ""          # 应用私钥（RSA2）
    public-key: ""           # 支付宝公钥
    notify-url: ""           # 异步通知回调地址（如: https://your-domain.com/api/payments/alipay/notify）
    return-url: ""           # 同步跳转地址（如: https://your-domain.com/payment/success）
  stripe:
    secret-key: ""           # Stripe Secret Key（sk_test_xxx 或 sk_live_xxx）
    publishable-key: ""      # Stripe Publishable Key（pk_test_xxx 或 pk_live_xxx）
    webhook-secret: ""       # Stripe Webhook 签名密钥（whsec_xxx）

# ========== 文件上传配置 ==========
# 支持本地存储和 S3 兼容对象存储（AWS S3、阿里云 OSS、腾讯云 COS、MinIO 等）
upload:
  platform: "local"          # 存储平台：local（本地）/ s3（对象存储）
  local:
    base-path: "./uploads"   # 本地上传目录
  s3:
    access-key: ""           # S3 Access Key ID
    secret-key: ""           # S3 Secret Access Key
    region: ""               # S3 Region（如: us-east-1, ap-southeast-1）
    endpoint: ""             # S3 Endpoint（自定义端点，如 MinIO: http://localhost:9000, 阿里云: https://oss-cn-hangzhou.aliyuncs.com）
    bucket-name: ""          # S3 Bucket 名称
    domain: ""               # CDN/访问域名（如: https://cdn.your-domain.com/）
    base-path: "s3/"         # 存储基础路径前缀

# ========== Embedding 向量化配置 ==========
# 用于 RAG 知识库的文档向量化存储
embedding:
  name: "OpenAI"             # Embedding 模型提供商（OpenAI / SiliconFlow 等，实际通过 LLM Provider 配置）
  vector-store:
    host: ""                 # 向量数据库地址（默认回退到 database.host）
    port: 0                  # 向量数据库端口（默认回退到 database.port）
    user: ""                 # 向量数据库用户（默认回退到 database.user）
    password: ""             # 向量数据库密码（默认回退到 database.password）
    database: ""             # 向量数据库名称（默认回退到 database.name）
    table: "public.vector_store"  # 向量表名
    dimension: 1024          # 向量维度（需与 Embedding 模型输出维度一致）
    drop-table-first: false
    create-table: true       # 自动创建向量表

# ========== Memory 向量存储配置 ==========
# 独立于知识库的记忆向量存储
memory:
  embedding:
    vector-store:
      host: ""               # 默认回退到 embedding.vector-store 配置
      port: 0
      user: ""
      password: ""
      database: ""
      table: "public.memory_vector_store"
      dimension: 1024
      drop-table-first: false
      create-table: true

# ========== Rerank 重排序配置 ==========
# 用于 RAG 检索结果的重排序优化
rerank:
  name: "OpenAI"
  api-key: ""                # Rerank API Key（如 SiliconFlow API Key）
  api-url: ""                # Rerank API URL（如: https://api.siliconflow.cn/v1/rerank）
  model: "Pro/BAAI/bge-reranker-v2-m3"
  timeout: 30000             # 超时时间（毫秒）

# ========== RAG 配置 ==========
# 知识库文档处理和检索配置
rag:
  markdown:
    segment-split:
      enabled: true
      max-length: 1800       # 分段最大长度
      min-length: 200        # 分段最小长度
      buffer-size: 100       # 缓冲区大小
      enable-overlap: false  # 是否启用重叠
      overlap-size: 50       # 重叠大小
  vector:
    max-length: 1800
    min-length: 200
    overlap-size: 100

# ========== 高可用配置 ==========
high-availability:
  enabled: false
  gateway-url: http://localhost:8081
  api-key: default-api-key-1234567890
  connect-timeout: 30000     # 连接超时（毫秒）
  read-timeout: 60000        # 读取超时（毫秒）

# ========== MCP 网关配置 ==========
mcp:
  gateway:
    connect-timeout: 60000   # MCP 网关连接超时（毫秒）